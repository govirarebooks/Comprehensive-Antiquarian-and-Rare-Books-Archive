name: Validate dataset

on:
  workflow_dispatch:

  push:
    paths:
      - "govi-rare-books-academic-dataset.json"
      - "scripts/**"
      - "rag/**"
      - ".github/workflows/validate.yml"

  pull_request:
    paths:
      - "govi-rare-books-academic-dataset.json"
      - "scripts/**"
      - "rag/**"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Validate dataset
        run: python scripts/validate_dataset.py

      - name: Prepare RAG documents
        run: python rag/prepare_documents.py

      - name: Upload RAG documents
        uses: actions/upload-artifact@v4
        with:
          name: rag-documents
          path: rag/documents.json

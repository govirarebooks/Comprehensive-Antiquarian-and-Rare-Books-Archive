name: Validate dataset

on:
  workflow_dispatch:

  push:
    paths:
      - "govi-rare-books-academic-dataset.json"
      - "scripts/**"
      - "rag/**"
      - ".github/workflows/validate.yml"

  pull_request:
    paths:
      - "govi-rare-books-academic-dataset.json"
      - "scripts/**"
      - "rag/**"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      # ----------------------------------------------------------
      # CPU-ONLY PyTorch
      # Prevent sentence-transformers from pulling CUDA/NVIDIA
      # packages.
      # ----------------------------------------------------------

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      # ----------------------------------------------------------
      # RAG dependencies
      # ----------------------------------------------------------

      - name: Install RAG dependencies
        run: |
          pip install sentence-transformers numpy

      # ----------------------------------------------------------
      # Hugging Face model cache
      # ----------------------------------------------------------

      - name: Restore Hugging Face model cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-model-${{ runner.os }}-${{ hashFiles('rag/build_vector_index.py', 'rag/search.py') }}
          restore-keys: |
            huggingface-model-${{ runner.os }}-

      # ----------------------------------------------------------
      # Vector index cache
      #
      # The previous index is restored even when the dataset changes.
      # build_vector_index.py then decides document-by-document whether
      # an embedding can be reused.
      # ----------------------------------------------------------

      - name: Restore vector index cache
        uses: actions/cache/restore@v4
        with:
          path: |
            rag/vector_index.npz
            rag/vector_metadata.json
          key: vector-index-${{ runner.os }}-${{ hashFiles('govi-rare-books-academic-dataset.json', 'rag/prepare_documents.py', 'rag/build_vector_index.py') }}
          restore-keys: |
            vector-index-${{ runner.os }}-

      # ----------------------------------------------------------
      # Validate source dataset
      # ----------------------------------------------------------

      - name: Validate dataset
        run: python scripts/validate_dataset.py

      # ----------------------------------------------------------
      # Prepare RAG documents
      # ----------------------------------------------------------

      - name: Prepare RAG documents
        run: python rag/prepare_documents.py

      # ----------------------------------------------------------
      # Build / update vector index
      # ----------------------------------------------------------

      - name: Build vector index
        run: python rag/build_vector_index.py

      # ----------------------------------------------------------
      # Test RAG search
      # ----------------------------------------------------------

      - name: Test RAG search
        run: |
          python rag/search.py "astrologia"
          python rag/search.py "astrologia XVI secolo"
          python rag/search.py "libri medicina cinquecento"
          python rag/search.py "books concerning occult practices and celestial predictions"

      # ----------------------------------------------------------
      # Save Hugging Face model cache
      # ----------------------------------------------------------

      - name: Save Hugging Face model cache
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-model-${{ runner.os }}-${{ hashFiles('rag/build_vector_index.py', 'rag/search.py') }}

      # ----------------------------------------------------------
      # Save updated vector index
      # ----------------------------------------------------------

      - name: Save vector index cache
        uses: actions/cache/save@v4
        with:
          path: |
            rag/vector_index.npz
            rag/vector_metadata.json
          key: vector-index-${{ runner.os }}-${{ hashFiles('govi-rare-books-academic-dataset.json', 'rag/prepare_documents.py', 'rag/build_vector_index.py') }}

      # ----------------------------------------------------------
      # Upload build artifacts
      # ----------------------------------------------------------

      - name: Upload RAG documents
        uses: actions/upload-artifact@v4
        with:
          name: rag-documents
          path: rag/documents.json

      - name: Upload vector index
        uses: actions/upload-artifact@v4
        with:
          name: rag-vector-index
          path: |
            rag/vector_index.npz
            rag/vector_metadata.json
